<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sampo Quest — Water Realm (Prototype)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <img src="/assets/login.png" alt="Login" class="login-art"/>
        <h2>Welcome to Sampo Quest — Water Realm</h2>
        <input id="playerNameInput" placeholder="Enter your name" />
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:center">
          <button id="createBtn">Create Game</button>
          <input id="sessionInput" placeholder="Session code" style="width:140px" />
          <button id="joinBtn">Join Game</button>
        </div>
        <div style="margin-top:8px">
          <small>After creating a game share the session code with other players.</small>
        </div>
      </div>
    </div>

    <div id="appRoot" class="game-root hidden">
      <div class="game-container">
        <aside class="hud">
          <h3 id="sessionName">Water Realm</h3>
          <div class="players" id="playerList">
            <!-- player entries -->
          </div>
          <div style="margin-top:12px;color:#9ff">
            <div>Position: <span id="position">0</span> / <span id="progress">0/12</span></div>
            <div id="sessionStatus" style="font-size:12px;margin-top:6px;opacity:0.9"></div>
          </div>
        </aside>

        <div class="board-wrap">
          <div class="board" id="board">
            <img id="boardImg" class="pixel" src="/assets/water/board.png" alt="Water board"/>
            <div id="segments" class="segments" aria-hidden="true"></div>
            <img id="vainamoinenImg" class="pawn" src="/assets/water/vainamoinen.png" alt="Väinämöinen"/>
            <canvas id="particles" width="640" height="640" style="position:absolute;left:0;top:0;pointer-events:none"></canvas>
          </div>
        </div>

        <aside class="hud" style="width:240px">
          <h3>Actions</h3>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
            <button id="drawBtn" class="btn">Draw Card</button>
            <button id="ainoBtn" class="btn">Talk to Aino</button>
            <button id="resetBtn" class="btn">Reset</button>
          </div>
          <div id="debugPanel" style="margin-top:12px;color:#cfc;font-size:12px"></div>
        </aside>
      </div>

      <div id="cardModal" class="card-modal hidden" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
        <h2 id="cardTitle">Card</h2>
        <div id="cardInstructions"></div>
        <div id="cardDifficulty" style="margin-top:8px"></div>
        <div class="complete-area" style="margin-top:12px">
          <button id="completeBtn" class="btn">Complete</button>
          <div id="completedByList" style="display:flex;gap:6px;margin-left:8px"></div>
        </div>
      </div>

      <div id="overlayModal" class="modal hidden">
        <div class="modal-content">
          <button id="closeModal" class="close">×</button>
          <div id="modalBody"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
